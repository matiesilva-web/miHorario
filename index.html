<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Asistente IA - Requisitos</title>
  <link rel="manifest" href="./manifest.json" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .prose p { margin-bottom: 0.5rem; }
    .prose p:last-child { margin-bottom: 0; }
    .prose ul, .prose ol { margin-left: 1.25rem; margin-bottom: 0.5rem; list-style-type: disc; }
    .prose ol { list-style-type: decimal; }
    .prose pre { background: #1e293b; color: #f8fafc; padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0.5rem 0; font-size: 0.85rem; }
    .prose code { background: rgba(148, 163, 184, 0.2); padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
    .prose pre code { background: transparent; padding: 0; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-[100dvh] flex flex-col overflow-hidden select-none sm:select-auto">

  <!-- Barra superior -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center font-bold text-white shadow">IA</div>
      <div>
        <h1 class="font-semibold text-sm sm:text-base leading-tight">Asistente Requisitos IA</h1>
        <div class="flex items-center gap-1.5 text-xs text-slate-400">
          <span id="server-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
          <span id="server-status">Conectando con Render...</span>
        </div>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <button id="install-btn" class="hidden text-xs bg-indigo-600/20 text-indigo-300 border border-indigo-500/40 px-2.5 py-1.5 rounded-lg hover:bg-indigo-600/30 transition">
        Instalar App
      </button>
      <button id="logout-btn" class="hidden text-xs bg-slate-800 text-slate-300 border border-slate-700 px-2.5 py-1.5 rounded-lg hover:bg-slate-700 transition">
        Salir
      </button>
    </div>
  </header>

  <!-- Pantalla de Login -->
  <main id="login-screen" class="flex-1 flex items-center justify-center p-4 overflow-y-auto">
    <div class="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-5">
      <div class="text-center space-y-1">
        <h2 class="text-xl font-bold text-white">Acceso Privado</h2>
        <p class="text-xs text-slate-400">Inicia sesión con tu cuenta autorizada de Firebase</p>
      </div>

      <button id="google-login-btn" class="w-full bg-white text-slate-900 font-medium py-2.5 px-4 rounded-xl flex items-center justify-center gap-2.5 hover:bg-slate-100 active:scale-[0.99] transition shadow">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.14C3.26 21.3 7.31 24 12 24Z"/>
          <path fill="#FBBC05" d="M5.28 14.24c-.24-.72-.38-1.49-.38-2.24s.14-1.52.38-2.24V6.62H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.38l3.99-3.14Z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.26 2.7 1.29 6.62l3.99 3.14c.95-2.85 3.6-4.96 6.72-4.96Z"/>
        </svg>
        Continuar con Google
      </button>

      <div class="relative flex py-1 items-center">
        <div class="flex-grow border-t border-slate-800"></div>
        <span class="flex-shrink mx-3 text-xs text-slate-500">o con correo</span>
        <div class="flex-grow border-t border-slate-800"></div>
      </div>

      <form id="email-login-form" class="space-y-3">
        <input id="email-input" type="email" required placeholder="Correo electrónico"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
        <input id="password-input" type="password" required placeholder="Contraseña"
          class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500" />
        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 px-4 rounded-xl transition text-sm">
          Iniciar sesión
        </button>
      </form>

      <p id="auth-error" class="hidden text-xs text-rose-400 bg-rose-950/50 border border-rose-800/60 rounded-lg p-2.5 text-center"></p>
    </div>
  </main>

  <!-- Pantalla de Chat -->
  <section id="chat-screen" class="hidden flex-1 flex flex-col overflow-hidden">
    <div id="messages-container" class="flex-1 overflow-y-auto p-4 space-y-4">
      <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 text-sm text-slate-300 max-w-2xl mx-auto">
        Hola. Escribe tu consulta o requisito abajo para procesarlo con <strong>Gemini 2.5 Flash</strong> y guardarlo automáticamente en tu historial.
      </div>
    </div>

    <!-- Barra inferior de entrada -->
    <form id="chat-form" class="bg-slate-900 border-t border-slate-800 p-3 shrink-0">
      <div class="max-w-3xl mx-auto flex items-end gap-2">
        <textarea id="message-input" rows="1" placeholder="Escribe tu mensaje aquí..."
          class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 resize-none max-h-36"></textarea>
        <button id="send-btn" type="submit"
          class="bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed text-white p-2.5 rounded-xl transition shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7" />
          </svg>
        </button>
      </div>
    </form>
  </section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      query,
      orderBy,
      limit,
      getDocs
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const API_BASE_URL = "https://mihorario-s7ye.onrender.com";

    const firebaseConfig = {
      apiKey: "AIzaSyCAKcF_8nKk1YsBpnjD3v4GaOj_Wua5zss",
      authDomain: "app-requisitos-ia.firebaseapp.com",
      projectId: "app-requisitos-ia",
      storageBucket: "app-requisitos-ia.firebasestorage.app",
      messagingSenderId: "428581283954",
      appId: "1:428581283954:web:d5926a454b68a4cb7dbaeb"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    // Referencias DOM
    const serverDot = document.getElementById("server-dot");
    const serverStatus = document.getElementById("server-status");
    const loginScreen = document.getElementById("login-screen");
    const chatScreen = document.getElementById("chat-screen");
    const logoutBtn = document.getElementById("logout-btn");
    const googleLoginBtn = document.getElementById("google-login-btn");
    const emailLoginForm = document.getElementById("email-login-form");
    const authError = document.getElementById("auth-error");
    const messagesContainer = document.getElementById("messages-container");
    const chatForm = document.getElementById("chat-form");
    const messageInput = document.getElementById("message-input");
    const sendBtn = document.getElementById("send-btn");

    // 1. Despertar Render (/health) al cargar la página
    async function checkBackendHealth() {
      try {
        const res = await fetch(`${API_BASE_URL}/health`);
        if (res.ok) {
          const data = await res.json();
          serverDot.className = "w-2 h-2 rounded-full bg-emerald-400";
          serverStatus.textContent = `En línea (${data.modelo})`;
        } else {
          throw new Error("Respuesta no válida");
        }
      } catch {
        serverDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
        serverStatus.textContent = "Iniciando servidor (puede tardar ~50s)...";
        setTimeout(checkBackendHealth, 8000);
      }
    }
    checkBackendHealth();

    // 2. Funciones de UI para burbujas de chat
    function appendMessage(role, text, meta = "") {
      const wrapper = document.createElement("div");
      wrapper.className = `max-w-3xl mx-auto flex flex-col ${role === "user" ? "items-end" : "items-start"}`;

      const bubble = document.createElement("div");
      if (role === "user") {
        bubble.className = "bg-indigo-600 text-white rounded-2xl rounded-br-sm px-4 py-2.5 text-sm max-w-[85%] whitespace-pre-wrap shadow";
        bubble.textContent = text;
      } else {
        bubble.className = "bg-slate-900 border border-slate-800 text-slate-100 rounded-2xl rounded-bl-sm px-4 py-3 text-sm max-w-[92%] prose shadow";
        bubble.innerHTML = marked.parse(text);
      }

      wrapper.appendChild(bubble);

      if (meta) {
        const label = document.createElement("span");
        label.className = "text-[10px] text-slate-500 mt-1 px-1";
        label.textContent = meta;
        wrapper.appendChild(label);
      }

      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
      return wrapper;
    }

    // 3. Cargar historial desde Firestore (si las reglas de lectura lo permiten)
    async function loadUserHistory(uid) {
      try {
        const q = query(
          collection(db, "usuarios", uid, "historial"),
          orderBy("creado_en", "asc"),
          limit(30)
        );
        const snap = await getDocs(q);
        if (!snap.empty) {
          messagesContainer.innerHTML = "";
          snap.forEach((doc) => {
            const d = doc.data();
            if (d.mensaje) appendMessage("user", d.mensaje);
            if (d.respuesta) appendMessage("ai", d.respuesta, `${d.modelo || "gemini-2.5-flash"} • ID: ${doc.id.slice(0, 6)}`);
          });
        }
      } catch (err) {
        console.info("Historial previo no cargado desde cliente:", err.message);
      }
    }

    // 4. Manejo de Autenticación
    function showAuthError(msg) {
      authError.textContent = msg;
      authError.classList.remove("hidden");
    }

    googleLoginBtn.addEventListener("click", async () => {
      authError.classList.add("hidden");
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (err) {
        showAuthError(`Error Google Auth: ${err.message}`);
      }
    });

    emailLoginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      authError.classList.add("hidden");
      const email = document.getElementById("email-input").value.trim();
      const pass = document.getElementById("password-input").value;
      try {
        await signInWithEmailAndPassword(auth, email, pass);
      } catch (err) {
        showAuthError(`Error de acceso: ${err.message}`);
      }
    });

    logoutBtn.addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        loginScreen.classList.add("hidden");
        chatScreen.classList.remove("hidden");
        logoutBtn.classList.remove("hidden");
        await loadUserHistory(user.uid);
      } else {
        loginScreen.classList.remove("hidden");
        chatScreen.classList.add("hidden");
        logoutBtn.classList.add("hidden");
      }
    });

    // 5. Envío de mensajes a FastAPI (/chat)
    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = `${Math.min(messageInput.scrollHeight, 144)}px`;
    });

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = messageInput.value.trim();
      const user = auth.currentUser;
      if (!text || !user) return;

      messageInput.value = "";
      messageInput.style.height = "auto";
      sendBtn.disabled = true;

      appendMessage("user", text);
      const loadingBubble = appendMessage("ai", "_Procesando con Gemini... (si el servidor estaba en reposo puede tardar unos 50 segundos)_");

      try {
        const idToken = await user.getIdToken();
        const response = await fetch(`${API_BASE_URL}/chat`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${idToken}`
          },
          body: JSON.stringify({ mensaje: text })
        });

        const data = await response.json();
        loadingBubble.remove();

        if (!response.ok) {
          appendMessage("ai", `**Error (${response.status}):** ${data.detail || "No se pudo completar la solicitud."}`);
        } else {
          serverDot.className = "w-2 h-2 rounded-full bg-emerald-400";
          serverStatus.textContent = `En línea (${data.modelo})`;
          appendMessage("ai", data.respuesta, `${data.modelo} • Guardado (${data.registro_id.slice(0, 6)})`);
        }
      } catch (err) {
        loadingBubble.remove();
        appendMessage("ai", `**Error de red:** No se pudo conectar con el servidor (${err.message}).`);
      } finally {
        sendBtn.disabled = false;
        messageInput.focus();
      }
    });

    // 6. Registro de Service Worker e instalación PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }

    let deferredPrompt;
    const installBtn = document.getElementById("install-btn");
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      installBtn.classList.remove("hidden");
    });

    installBtn.addEventListener("click", async () => {
      if (!deferredPrompt) return;
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
      installBtn.classList.add("hidden");
    });
  </script>
</body>
</html>
